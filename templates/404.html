<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Google Cloud Summit 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
<header class="nav-bar" role="banner">
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <svg class="gcloud-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="20" fill="url(#gcloudGrad3)"/>
        <path d="M28 18.5a8 8 0 1 0-8 8v-4a4 4 0 1 1 4-4h4z" fill="white"/>
        <defs>
          <linearGradient id="gcloudGrad3" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
            <stop stop-color="#4285F4"/>
            <stop offset="0.5" stop-color="#0F9D58" />
            <stop offset="1" stop-color="#FBBC04"/>
          </linearGradient>
        </defs>
      </svg>
      <span>Google Cloud Summit <strong>2026</strong></span>
    </a>
  </div>
</header>
<main class="error-page">
  <div class="error-content">
    <span class="error-code">404</span>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-msg">That page doesn't exist. The talk may have been removed or the URL is incorrect.</p>
    <a href="/" class="btn btn-primary" id="error-home-btn">Return Home</a>
  </div>
</main>
</body>
</html>
